services:
    api:
        build: .
        container_name: continew_api
        restart: always
        command: node dist/api/server.js
        ports:
            - "${PORT:-3000}:3000"
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-continew}
            REDIS_URL: redis://redis:6379
            PORT: 3000
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        build: .
        container_name: continew_worker
        restart: always
        command: node dist/worker/index.js
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-continew}
            REDIS_URL: redis://redis:6379
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        container_name: continew_postgres
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-continew}" ]
            interval: 20s
            timeout: 5s
            retries: 5
            start_period: 30s

    redis:
        image: redis:alpine
        container_name: continew_redis
        restart: always
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 20s
            timeout: 5s
            retries: 5
            start_period: 30s
volumes:
    postgres_data:
    redis_data:
