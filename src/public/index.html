<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continew — Live Webhook Delivery Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Primary Monochrome Palette */
            --bg-base: #0A0A0A;
            --bg-card: #121212;
            --bg-card-hover: #1C1C1C;
            --border: #262626;
            --border-focus: #52525B;
            --text-primary: #EDEDED;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;

            /* Subtle Status Accents (Small indicators & Badges only) */
            --accent-green: #10B981;
            --accent-green-bg: rgba(16, 185, 129, 0.12);
            --accent-red: #EF4444;
            --accent-red-bg: rgba(239, 68, 68, 0.12);
            --accent-yellow: #F59E0B;
            --accent-yellow-bg: rgba(245, 158, 11, 0.12);
            --accent-purple: #A855F7;
            --accent-purple-bg: rgba(168, 85, 247, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 28px 24px;
        }

        .container {
            max-width: 1320px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .brand-title span {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 18px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* WS Status Indicator */
        .ws-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 9999px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-red);
            transition: background-color 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-dot.connecting {
            background-color: var(--accent-yellow);
        }

        /* Stat Metrics Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s ease;
        }

        .metric-card:hover {
            border-color: var(--border-focus);
        }

        .metric-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .metric-value {
            font-size: 26px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .val-total {
            color: var(--text-primary);
        }

        .val-success {
            color: var(--accent-green);
        }

        .val-failed {
            color: var(--accent-red);
        }

        .val-latency {
            color: var(--text-primary);
        }

        /* Controls / Filter Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .table-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 230px;
            transition: border-color 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--text-primary);
        }

        .filter-select,
        .btn-action {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .filter-select:focus,
        .filter-select:hover,
        .btn-action:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
        }

        /* Table Card */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #0E0E0E;
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 14px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 600;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background-color 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: var(--bg-card-hover);
        }

        /* Subtle row pulse for incoming events */
        @keyframes row-flash {
            0% {
                background-color: rgba(255, 255, 255, 0.08);
            }

            100% {
                background-color: transparent;
            }
        }

        .row-new {
            animation: row-flash 2s ease-out;
        }

        td {
            padding: 14px 16px;
            font-size: 13px;
            vertical-align: middle;
            color: var(--text-secondary);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-primary);
        }

        /* Small Accents: Status Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-succeeded {
            background: var(--accent-green-bg);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .badge-failed {
            background: var(--accent-red-bg);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .badge-retrying,
        .badge-pending {
            background: var(--accent-yellow-bg);
            color: var(--accent-yellow);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .badge-exhausted {
            background: var(--accent-purple-bg);
            color: var(--accent-purple);
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        /* Status Codes */
        .status-code {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .code-2xx {
            color: var(--accent-green);
        }

        .code-4xx {
            color: var(--accent-yellow);
        }

        .code-5xx,
        .code-null {
            color: var(--accent-red);
        }

        /* Empty State */
        .empty-state {
            padding: 56px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .error-cell {
            color: var(--text-muted);
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div>
                <h1 class="brand-title">Continew <span>/ Live Stream</span></h1>
                <p class="brand-subtitle">Real-time webhook delivery audit log & circuit breaker monitor</p>
            </div>
            <div class="ws-status" id="wsStatus">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <!-- Metric Summary Cards -->
        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Total Attempts</span>
                <span class="metric-value val-total" id="metricTotal">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Succeeded</span>
                <span class="metric-value val-success" id="metricSuccess">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Failed</span>
                <span class="metric-value val-failed" id="metricFailed">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Avg Latency</span>
                <span class="metric-value val-latency" id="metricLatency">0 ms</span>
            </div>
        </div>

        <!-- Controls / Search & Filters -->
        <div class="controls-bar">
            <h2 class="table-title">Live Delivery Log</h2>
            <div class="filter-group">
                <!-- Endpoint Dropdown Selector -->
                <select id="endpointSelect" class="filter-select" style="max-width: 260px;">
                    <option value="">Select an Endpoint...</option>
                </select>
                <button id="btnLoadHistory" class="btn-action">Load History</button>

                <input type="text" id="searchInput" class="search-input" placeholder="Search by Event ID...">
                <select id="statusFilter" class="filter-select">
                    <option value="ALL">All Statuses</option>
                    <option value="succeeded">Succeeded</option>
                    <option value="failed">Failed</option>
                    <option value="exhausted">Exhausted</option>
                </select>
                <button id="btnClear" class="btn-action">Clear Log</button>
            </div>
        </div>

        <!-- Attempts Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Event ID</th>
                        <th>Attempt</th>
                        <th>Status</th>
                        <th>Code</th>
                        <th>Latency</th>
                        <th>Error / Note</th>
                    </tr>
                </thead>
                <tbody id="attemptsTableBody">
                    <tr id="emptyRow">
                        <td colspan="7" class="empty-state">
                            Waiting for webhook delivery attempts...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Client Script -->
    <script src="app.js"></script>
</body>

</html>
